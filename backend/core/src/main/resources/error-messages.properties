# =============================================================================
# Message tiếng Việt cho danh mục mã lỗi (conventions.md §2.3)
#
# ⚠ TÊN FILE KHÔNG CÓ HẬU TỐ `_vi` — CỐ Ý.
#   MessageSourceAutoConfiguration của Spring Boot chỉ tạo MessageSource khi tìm
#   thấy file ĐÚNG TÊN basename (`error-messages.properties`). Nếu chỉ có
#   `error-messages_vi.properties` thì điều kiện không thoả, không có MessageSource
#   nào được tạo, và MỌI mã lỗi trả ra ngoài dưới dạng khoá thô ("OPS-2001") thay vì
#   câu tiếng Việt. Lỗi này im lặng hoàn toàn — chỉ lộ ra khi người dùng gặp lỗi thật.
#   Hệ thống chốt chỉ tiếng Việt (BOQ đợt 1) nên một file mặc định là đủ và an toàn.
#
# Khoá = mã lỗi. Mọi hằng trong ErrorCode PHẢI có một dòng ở đây —
# ErrorCatalogTest làm build đỏ nếu thiếu, hoặc nếu ở đây có khoá thừa.
#
# ⚠ Cú pháp MessageFormat: tham số là {0}, {1}… KHÔNG phải {traceId}.
#   Dấu nháy đơn phải viết đôi ('') nếu message có tham số.
#
# ⚠ Đây là nội dung NGƯỜI DÙNG ĐỌC: không được lộ tên bảng, câu SQL, tên
#   class hay bất kỳ chi tiết kỹ thuật nào (§2.2).
#
# Sửa/thêm dòng ở đây thì phải cập nhật cả `shared/error-map.ts` bên FE.
# File lưu UTF-8; Spring Boot đọc properties bằng UTF-8 mặc định từ 2.x.
# =============================================================================

