# =============================================================================
# Cập nhật phụ thuộc tự động — T61.40 (ASVS 14.2.1)
#
# ⚠ Kho ĐÃ có cổng quét CVE chạy đêm (`security-scan.yml`) + `dependency-review`
#   ở mỗi PR. Thứ còn thiếu là **đường ĐI TỚI BẢN VÁ**: hôm nay một người phải
#   đọc báo cáo rồi tự nâng tay, và bảng §10.76 ghi lại đúng cái giá của việc ấy
#   — tập CVE đi từ 12 lên 15 mã trong 2,6 ngày mà mã dự án ⛔ đổi một dòng.
#
# ⚠⚠ `open-pull-requests-limit` cố ý THẤP: mỗi PR tốn một lượt CI đầy đủ (~12
#   phút) và runner là tài nguyên chung. Nhóm theo `groups` để một lượt nâng
#   Spring Boot ⛔ nở thành hai chục PR rời rạc.
# =============================================================================
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
      kiem-thu:
        patterns: ["org.junit*", "org.assertj*", "org.mockito*", "org.testcontainers*"]
    commit-message:
      prefix: "chore(deps)"

  # ⛔⛔ MỘT mục cho CẢ `frontend`, ⛔ không phải một mục mỗi ứng dụng — T63.1.
  #   `frontend/` là một **npm workspaces** với ĐÚNG MỘT lockfile ở gốc
  #   (`frontend/package-lock.json`); `admin-app/` và `public-web/` ⛔ có lockfile
  #   riêng. Bản đầu của tệp này (T61.40) khai hai thư mục con ⇒ Dependabot sửa
  #   `package.json` con rồi ⛔ có lockfile nào để cập nhật ⇒ `npm ci` từ chối
  #   (*"package.json and package-lock.json are not in sync"*) ⇒ **7/7 PR frontend
  #   của lượt chạy THẬT đầu tiên đều đỏ**. Cấu hình ⛔ sai cú pháp, nó chỉ chưa
  #   bao giờ được chạy — đúng hình dạng luật 7.
  #
  # ⭐ 18/09 (T63.2): gói nội bộ đã đổi tên sang `@songnhue/design-tokens` — một phạm
  #   vi ta sở hữu, nên npm ⛔ thể tìm thấy gói cùng tên trên kho công khai và một lượt
  #   cài sai là lượt cài ĐỎ. Dòng `ignore` bên dưới **vẫn giữ**: nó chặn Dependabot đề
  #   nghị nâng chính gói của ta, việc ấy ⛔ liên quan tới chuyện đổi tên.
  #
  # ⛔⛔ `ignore` bên dưới là **chống nhầm gói**, ⛔ phải để đỡ ồn. `design-tokens`
  #   là gói NỘI BỘ của workspace (`frontend/design-tokens`, `private: true`,
  #   phiên bản `0.1.0`) — mà trên npm công khai **có một gói CÙNG TÊN của người
  #   khác**, `latest = 1.0.1`. Dependabot đã mở đúng PR ấy (#145). Nếu nó được
  #   gộp thì dải phiên bản `1.0.1` ⛔ còn khớp gói nội bộ `0.1.0` ⇒ npm quay sang
  #   **kho công khai** ⇒ mã của người lạ thay chỗ bộ token của dự án, trong cả
  #   `admin-app` lẫn `public-web`, ⛔ một dòng nào báo.
  #   ⇒ Bất biến ấy có bộ canh riêng: `PhuThuocNoiBoTest` (đọc lockfile, đòi
  #   `"link": true`) — một dòng `ignore` ⛔ phải một cổng kiểm.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "@songnhue/design-tokens"
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      antd:
        patterns: ["antd", "@ant-design/*"]
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
