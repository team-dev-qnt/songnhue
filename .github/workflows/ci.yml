# =============================================================================
# CI — cổng chất lượng bắt buộc trước khi merge (WS-10 / T10.6)
#
# Thứ tự các bước xếp theo "cái nào phát hiện lỗi sớm và rẻ nhất thì chạy trước":
#   format/lint (giây)  →  test đơn vị (giây)  →  test tích hợp có DB (phút)
# Nhờ vậy một PR sai định dạng biết ngay trong 30 giây thay vì chờ hết 5 phút.
#
# Job `security` tách riêng và KHÔNG chặn merge theo mặc định — quét CVE phụ
# thuộc vào dữ liệu NVD bên ngoài, có ngày nó chậm hoặc lỗi vì lý do chẳng liên
# quan gì tới thay đổi trong PR. Chặn merge bằng một thứ hay hỏng vì lý do bên
# ngoài là cách nhanh nhất để cả đội học thói quen bỏ qua CI.
# =============================================================================
name: CI

# ⚠ CHỈ chạy ở `dev` và ở PR hướng vào `dev`. Đây là chủ ý, không phải thiếu sót:
# luồng đã chốt là mọi kiểm tra nặng diễn ra đúng một lần ở `dev`, còn hai chặng
# staging/production chỉ xác minh "thứ đang lên đúng là thứ đã kiểm"
# (`promotion-guard.yml`). Thêm staging/production vào đây là chạy lại cùng bộ
# kiểm tra trên cùng một mã nguồn, mỗi lần đề bạt tốn thêm vài phút mà không
# phát hiện thêm được gì.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Push liên tiếp vào cùng một nhánh: huỷ lượt chạy cũ, chỉ giữ lượt mới nhất.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Spotless + Checkstyle gắn ở phase `validate` nên chúng tự chạy trong mọi
      # lệnh dưới đây. Chạy riêng một lượt trước để lỗi định dạng hiện ra ngay,
      # không lẫn vào log biên dịch.
      - name: Định dạng và quy ước mã nguồn
        working-directory: backend
        run: ./mvnw -B -ntp spotless:check checkstyle:check

      # `verify` gồm: biên dịch → test đơn vị → test tích hợp (Testcontainers) →
      # bộ luật ArchUnit → cổng bao phủ JaCoCo cho tầng domain.
      #
      # ⚠ Testcontainers cần Docker. Runner của GitHub có sẵn, nhưng phiên bản
      # API Docker được ghim ở `docker.api.version` trong backend/app/pom.xml —
      # xem ghi chú ở đó: Docker Engine 29 đã bỏ mọi API cũ hơn 1.44, còn engine
      # cũ hơn 25.0 lại chưa có 1.44, nên không có con số nào đúng cho cả hai.
      # Runner nào chạy engine < 25.0 thì truyền -Ddocker.api.version=1.43.
      - name: Build, test và cổng bao phủ
        working-directory: backend
        run: ./mvnw -B -ntp verify

      - name: Giữ lại báo cáo test khi hỏng
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/*/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend — lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Hai ứng dụng FE thuộc WS-8 và WS-9, chưa tồn tại ở thời điểm viết job này.
      # Bỏ qua có điều kiện thay vì chờ tới lúc đó mới thêm job: khi thư mục xuất
      # hiện, CI tự bắt đầu kiểm nó mà không ai phải nhớ quay lại sửa file này.
      - name: Có mã nguồn FE chưa?
        id: detect
        run: |
          if [ -f frontend/admin-app/package.json ] || [ -f frontend/public-web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Chưa có mã nguồn frontend (WS-8/WS-9) — bỏ qua."
          fi

      - name: Cài Node 22
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint admin-app
        if: steps.detect.outputs.exists == 'true' && hashFiles('frontend/admin-app/package.json') != ''
        working-directory: frontend/admin-app
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit

      - name: Lint public-web
        if: steps.detect.outputs.exists == 'true' && hashFiles('frontend/public-web/package.json') != ''
        working-directory: frontend/public-web
        run: |
          npm ci
          npm run lint
          npx tsc --noEmit

  security:
    name: Quét lỗ hổng phụ thuộc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Không chặn merge: xem ghi chú đầu file. Kết quả vẫn hiện trong PR và vẫn
    # phải có người đọc — `continue-on-error` là để phân biệt "thư viện có lỗ
    # hổng" với "dịch vụ NVD đang hỏng", chứ không phải để bỏ qua kết quả.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # NVD_API_KEY không bắt buộc nhưng thiếu nó thì NVD giới hạn tốc độ rất
      # nặng và lượt quét đầu tiên mất hàng chục phút. Đăng ký miễn phí tại
      # https://nvd.nist.gov/developers/request-an-api-key rồi đặt vào
      # Settings → Secrets → Actions.
      - name: OWASP Dependency-Check (fail ở CVSS ≥ 7)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -ntp -P security verify -DskipTests

      - name: npm audit
        run: |
          for app in frontend/admin-app frontend/public-web; do
            if [ -f "$app/package.json" ]; then
              echo "→ $app"
              (cd "$app" && npm audit --audit-level=high)
            fi
          done

      - name: Giữ lại báo cáo CVE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/**/target/dependency-check-report.html
          retention-days: 14
          if-no-files-found: ignore
