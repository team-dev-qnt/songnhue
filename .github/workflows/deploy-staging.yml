# =============================================================================
# CD Staging — tự động khi có mã mới vào nhánh `staging` (WS-11 / T11.8)
#
# Tệp này chỉ làm ĐÚNG MỘT việc mà production không phải làm: trả lời câu *commit
# nào trên `dev` đã dựng ra đúng mã đang nằm trên `staging`?* Rồi giao phần còn
# lại cho `deploy.yml` — thân chung của cả hai môi trường.
# =============================================================================
name: CD Staging

on:
  push:
    branches: [staging]

# Hai lượt merge liên tiếp: để lượt sau chờ lượt trước xong. KHÔNG huỷ giữa chừng
# như bên CI — huỷ một lượt deploy đang chạy có thể để lại môi trường nửa vời.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  giai-dinh-dev:
    name: Đỉnh dev tương ứng
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.giai.outputs.dev_tip }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `fetch-depth: 0` lấy đủ lịch sử của NHÁNH ĐANG CHECKOUT, không lấy nhánh khác.
      - name: Nạp thêm nhánh dev để đối chiếu
        run: git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev

      # ═══════════════════════════════════════════════════════════════════════
      # Trả lời bằng CÂY TỆP, không bằng quan hệ cha–con. Hai bản trước đều vấp:
      #
      #   Bản 1 tin `HEAD^2` vô điều kiện. PR bị **squash** → commit một cha → rơi
      #   về SHA của chính staging, một SHA chưa bao giờ có trên `dev`, rồi báo
      #   "không tìm thấy image" kèm ba bước chẩn đoán trỏ vào ba chỗ đều đang
      #   tốt (§10.42).
      #
      #   Bản 2 thử "lấy cha nào nằm trên dev". Sai êm hơn: cha thứ nhất của một
      #   commit squash là tổ tiên chung cổ lỗ, mà nó *đúng là* nằm trên `dev`.
      #
      # Cây tệp trả lời thẳng câu đang hỏi và không phụ thuộc vào việc ai bấm nút
      # merge nào.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Giải đỉnh dev theo cây tệp
        id: giai
        run: |
          set -euo pipefail
          cay_staging="$(git rev-parse 'HEAD^{tree}')"
          dev_tip=""

          # Đường nhanh: commit `dev` mới nhất mà `staging` với tới được. Chỉ là
          # phỏng đoán — nó vẫn phải qua đúng phép kiểm cây như mọi ứng viên khác.
          base="$(git merge-base HEAD origin/dev 2>/dev/null || true)"
          if [ -n "$base" ] && [ "$(git rev-parse "$base^{tree}")" = "$cay_staging" ]; then
            dev_tip="$base"
            echo "Đỉnh dev: $dev_tip  (merge-base, cây tệp trùng khít)"
          fi

          # Đường chung: quét ngược `dev` tìm commit có cây trùng khít.
          if [ -z "$dev_tip" ]; then
            dev_tip="$(git rev-list -n 200 origin/dev | while read -r c; do
                if [ "$(git rev-parse "$c^{tree}")" = "$cay_staging" ]; then echo "$c"; break; fi
              done)"
            if [ -n "$dev_tip" ]; then
              echo "::warning::Không nối được staging với dev qua merge-base — PR nhiều khả năng đã bị squash/rebase."
              echo "Đối chiếu theo cây tệp: nội dung staging trùng khít dev@$dev_tip nên dùng image của commit đó."
              echo "⚠ Lần sau chọn 'Create a merge commit' khi merge vào staging (docs/branch-protection.md §2.3-b)."
            fi
          fi

          if [ -z "$dev_tip" ]; then
            echo "::error::Cây tệp của staging không khớp commit nào trong 200 commit gần nhất của dev."
            echo ""
            echo "Nghĩa là staging đang mang mã KHÁC với mọi thứ đã dựng image trên dev — có thể vì"
            echo "PR bị squash/rebase rồi staging còn bị sửa thêm, hoặc có người đẩy thẳng vào staging."
            echo ""
            echo "⛔ Không đoán tiếp. Deploy một image không tương ứng với mã đang chạy là cách chắc"
            echo "   chắn nhất để có một môi trường không ai giải thích được."
            echo "Cách chữa: mở lại PR dev → staging và chọn **Create a merge commit**."
            exit 1
          fi

          echo "dev_tip=$dev_tip" >> "$GITHUB_OUTPUT"
          echo "Đỉnh dev đang đề bạt: \`$dev_tip\`" >> "$GITHUB_STEP_SUMMARY"

  trien-khai:
    name: Triển khai
    needs: giai-dinh-dev
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      moi_truong: staging
      commit_sha: ${{ needs.giai-dinh-dev.outputs.sha }}
      compose_file: compose.staging.yml
      # 4 trang tĩnh của `V202608191021` + 5 bài của bộ seed. Ngưỡng đặt ở 9 chứ
      # không ở 1 là cố ý: quên thêm `SEED_LOCATION` vào `/opt/songnhue/.env` (tệp
      # ấy KHÔNG được rsync) sẽ để lại đúng 4 bài, và với ngưỡng 1 thì lượt deploy
      # vẫn xanh còn cổng vẫn thiếu nội dung — đúng §10.45.
      so_bai_toi_thieu: 9
    # ⛔ Workflow thân chung chỉ thấy đúng bốn secret truyền vào đây. Không có
    #    đường nào — kể cả gõ nhầm một input — cho nó chạm tới `PROD_*`.
    secrets:
      HOST: ${{ secrets.STAGING_HOST }}
      USER: ${{ secrets.STAGING_USER }}
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      BASE_URL: ${{ secrets.STAGING_BASE_URL }}
