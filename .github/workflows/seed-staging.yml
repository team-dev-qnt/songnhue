# =============================================================================
# Nạp nội dung khởi tạo cho STAGING — chạy TAY, không bao giờ tự động
#
# ⛔ VÌ SAO KHÔNG GẮN VÀO CD: 5 bài trong `deploy/seed/` là bản SAO CHÉP NGUYÊN
#    VĂN từ báo ngoài (hanoimoi.vn, vneconomy.vn), kèm ảnh của họ. Một cổng
#    thông tin của doanh nghiệp nhà nước tự đăng lại chúng vì có người merge một
#    PR là vấn đề pháp lý, không phải lựa chọn kỹ thuật.
#
#    Cùng lý do khiến bộ seed là SCRIPT chứ không phải migration (deploy/seed/
#    README.md): Flyway chạy ở mọi môi trường, một chiều, không hỏi ai.
#
# ⛔ WORKFLOW NÀY KHÔNG NHẬN THAM SỐ MÔI TRƯỜNG. Nó chỉ biết bộ secret
#    `STAGING_*`. Không có đường nào — kể cả gõ nhầm — trỏ nó sang production.
#    Đó là chủ ý: một danh sách chọn "staging/production" là một cú nhấp sai.
# =============================================================================
name: Nạp nội dung Staging

on:
  workflow_dispatch:
    inputs:
      che_do:
        description: 'Chạy thử (không ghi gì) hay nạp thật'
        type: choice
        required: true
        default: chay-thu
        options: [chay-thu, nap-that]
      xac_nhan:
        description: 'Gõ đúng: nap-noi-dung-staging'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: seed-staging
  cancel-in-progress: false

jobs:
  seed:
    name: Nạp nội dung Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging

    steps:
      # Ô xác nhận gõ tay, cùng tinh thần với Restore UI (§7.3): việc ghi đè dữ
      # liệu của một môi trường phải tốn của người bấm nhiều hơn một cú nhấp.
      - name: Xác nhận
        run: |
          set -euo pipefail
          if [ "${{ inputs.xac_nhan }}" != "nap-noi-dung-staging" ]; then
            echo "::error::Ô xác nhận không khớp — gõ đúng chuỗi 'nap-noi-dung-staging'."
            exit 1
          fi
          echo "✓ Chế độ: ${{ inputs.che_do }}"

      - name: Kiểm tra đã có cấu hình máy chủ chưa
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.STAGING_HOST }}" ]; then
            echo "::error::Chưa cấu hình secret STAGING_HOST."
            exit 1
          fi

      # ⚠ KHÔNG chép lại `deploy/seed/` lên máy chủ ở đây. Bước "Đồng bộ cấu
      #   hình" của CD Staging đã rsync cả thư mục `deploy/` sang
      #   `/opt/songnhue/` ở mỗi lượt triển khai, nên bộ seed trên máy chủ luôn
      #   khớp với `staging`. Chép thêm một lần nữa từ đây là dựng đường thứ hai
      #   cho cùng một tệp, và hai đường thì sẽ có ngày lệch nhau.
      - name: Nạp
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

          co="${{ inputs.che_do == 'chay-thu' && '--dry-run' || '' }}"

          # `cd /opt/songnhue` là bắt buộc: seed.sh mặc định `COMPOSE=compose.staging.yml`
          # ở dạng đường dẫn TƯƠNG ĐỐI, và `ENV_FILE=/opt/songnhue/.env`.
          ssh "$USER@$HOST" bash -euo pipefail <<REMOTE
            cd /opt/songnhue
            ./seed/seed.sh $co
          REMOTE

      # ⚠⚠ PHẢI nói rõ ĐẠT hay HỎNG. Bản đầu chỉ in chế độ và một lời nhắc, dưới
      #    `if: always()` — nên nó hiện ra Y HỆT nhau ở lượt xanh và lượt đỏ.
      #    Lượt chạy thử đầu tiên hỏng với exit 127, người bấm đọc đúng khối này
      #    và hiểu là đã ổn (§10.46). Một bản tóm tắt không phân biệt được hai
      #    trạng thái thì tệ hơn không có, vì nó trấn an.
      - name: Ghi tóm tắt
        if: always()
        run: |
          {
            echo "### Nạp nội dung Staging"
            if [ "${{ job.status }}" = "success" ]; then
              echo "**✅ ĐẠT** — chế độ \`${{ inputs.che_do }}\`"
            else
              echo "**❌ HỎNG (\`${{ job.status }}\`)** — chế độ \`${{ inputs.che_do }}\`"
              echo ""
              echo "Chưa ghi gì hoặc ghi dở dang. Mở log bước **Nạp** để xem dòng lỗi;"
              echo "bộ seed idempotent nên chạy lại sau khi sửa là an toàn."
            fi
            echo ""
            if [ "${{ inputs.che_do }}" = "chay-thu" ]; then
              echo "ⓘ Chạy thử **không ghi gì và không in bảng đối chiếu** — bảng ấy chỉ có ở"
              echo "\`nap-that\`. Xanh ở đây nghĩa là kết nối, tệp \`.env\` và bộ seed đều đọc được."
            else
              echo "⚠ Bảng đối chiếu ở log chỉ chứng minh **CSDL có hàng**. Nó KHÔNG chứng minh"
              echo "MinIO có byte — hai thứ lệch nhau là hỏng câm. Ba phép kiểm cuối phải làm"
              echo "bằng trình duyệt, xem cuối \`deploy/seed/seed.sh\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
