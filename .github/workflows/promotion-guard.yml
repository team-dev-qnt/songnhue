# =============================================================================
# Cổng đề bạt — dev → staging | dev → production (WS-10 / T10.7)
#
# ⭐ ĐƠN GIẢN HOÁ 18/09/2026: ⛔ còn thứ tự bắt buộc `staging` trước `production`.
#   Cả hai đích đều nhận PR TỪ `dev` và chỉ hỏi ba câu:
#     1. Nguồn có phải `dev` không (chặn nhánh feature đi tắt vào môi trường thật).
#     2. `Cổng kiểm CI` của đỉnh `dev` (= head của PR) có xanh không — ở push `dev`
#        nó chỉ xanh khi 3 image đã dựng + gắn tag, tức CD có image để kéo.
#     3. Nhánh đích có commit riêng không (bắt lượt đề bạt bị SQUASH, §10.72).
#   ⛔ Không còn người duyệt (approve) — bảo vệ nhánh đặt 0.
#
# Luồng làm việc đã chốt: MỌI kiểm tra nặng chạy đúng một lần (PR vào `dev`).
# Chặng sau không kiểm lại — chỉ xác minh thứ được đẩy lên là thứ đã được kiểm.
#
# Job này cố ý CỰC NHẸ (vài giây) vì nó là check bắt buộc duy nhất của
# staging/production. Nó bịt đúng cái lỗ mà branch protection của GitHub không
# bịt được: **không có tuỳ chọn "chỉ nhận PR từ nhánh X"**. Thiếu nó, ai cũng mở
# được PR từ một nhánh feature thẳng vào production và không check nặng nào chặn
# lại, vì ta đã cố ý không yêu cầu chúng ở đó.
#
# ⚠ Đừng đổi tên job này mà quên sửa `contexts` trong branch protection: GitHub
# sẽ chờ một check không bao giờ tới, và mọi PR đề bạt kẹt ở "Expected — Waiting
# for status to be reported" mà không có dòng lỗi nào.
# =============================================================================
name: Promotion guard

on:
  pull_request:
    branches: [staging, production]

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  guard:
    name: Promotion guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Nhánh nguồn phải đúng chặng trước
        run: |
          target="${{ github.base_ref }}"
          source="${{ github.head_ref }}"

          case "$target" in
            staging | production) expected="dev" ;;
            *)
              echo "::error::Nhánh đích '$target' không nằm trong luồng đề bạt."
              exit 1
              ;;
          esac

          if [ "$source" != "$expected" ]; then
            echo "::error::PR vào '$target' chỉ được mở từ '$expected', đang mở từ '$source'."
            echo "Luồng đã chốt: merge vào dev trước (CI + dựng image), rồi mở PR dev → $target."
            echo "Đi tắt vào đây là đưa lên môi trường thật một thay đổi chưa qua kiểm tra nào."
            exit 1
          fi
          echo "✓ $source → $target"

      # Nhánh nguồn đúng vẫn chưa đủ: `dev` có thể vừa nhận một commit đang đỏ.
      # Vì vậy kiểm đúng SHA sắp được đề bạt, không kiểm "nhánh dev nói chung".
      # ⚠ Cần checkout TRƯỚC bước này: nó chạy script trong `.github/scripts/`.
      #   Lịch sử đầy đủ là yêu cầu của bước cuối, không phải của bước này.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ═══════════════════════════════════════════════════════════════════════
      # SHA NÀO MANG KẾT QUẢ CI — `head.sha` của PR, cho CẢ HAI đích.
      #
      # Bước trên đã ép nguồn = `dev`, nên head của PR LUÔN là đỉnh `dev` — commit
      # có check-run của lượt push `dev` (dựng image + `Cổng kiểm CI`). Từ 18/09
      # ⛔ còn PR `staging → production`, nên ⛔ còn cần giải cây tệp như bản
      # T11.86 (head khi ấy là merge commit trên `staging`, chưa từng chạy CI —
      # PR #94, cổng "về nguyên tắc không thể xanh").
      # ⚠ Qua `env:`, không nội suy thẳng vào `run:`.
      # ═══════════════════════════════════════════════════════════════════════
      - name: Commit này đã xanh CI ở chặng trước chưa
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Kiểm tra check-runs của $SHA"

          # ⛔⛔ VÌ SAO CÓ VÒNG CHỜ (thêm 1/9 sau một lượt đỏ giả)
          #
          #   Gộp một PR vào `dev` làm head SHA của PR đề bạt đổi NGAY, và
          #   `Promotion guard` chạy trước khi CI của `dev` kịp bắt đầu. Đo được:
          #   #77 gộp lúc 11:06:0x, cổng chạy 11:06:19, hai check bắt buộc trả
          #   `conclusion: null`. Bản cũ gọi đó là "kết thúc với 'null'" và đỏ.
          #
          #   Đây là CUỘC ĐUA, nên nó không xảy ra mọi lần — mở PR đề bạt lâu sau
          #   lượt gộp thì cổng xanh. Loại lỗi ấy dễ bị đóng hồ sơ nhầm bằng câu
          #   "chạy lại thấy xanh rồi".
          #
          # ⚠ Chờ có CHỐT, và hết chốt thì ĐỎ chứ không đi tiếp: một cổng đề bạt
          #   bỏ qua vì "chờ mãi không thấy" thì đúng bằng không có cổng.
          for lan in $(seq 1 20); do
            # ⭐⭐ T11.79 — `Cổng kiểm CI` PHẢI có trong bộ lọc, và nó là phần quan trọng nhất.
            #
            #    Đo 04/09: bộ lọc cũ chỉ khớp `Backend*` và `Frontend*`, tức **2 trên 9** check-run
            #    của một lượt push vào `dev`. Lượt đề bạt thật gần nhất (run 33834838646) in ra
            #    đúng hai dòng — bằng chứng thực nghiệm, không phải suy từ regex.
            #
            #    Bảy cái vô hình gồm những cái có hậu quả thật: `Thứ tự migration` (bộ canh sinh ra
            #    sau §10.66, đúng lớp lỗi đã giết hai lượt CD ngày 27/8 và bộ test *về nguyên tắc*
            #    không thấy — luật 30) và `Gắn tag SHA cho image không đổi` (đỏ ⇒ tag `:<sha>` có
            #    thể không tồn tại, mà `deploy-staging.yml` truyền `commit_sha` xuống để kéo image
            #    THEO ĐÚNG SHA đó).
            #
            #    ⛔ KHÔNG nới thành "mọi check-run": lượt quét CVE cũng chạy trên push vào `dev`
            #    khi `pom.xml` đổi, và `security-scan.yml` CỐ Ý đứng ngoài luồng chặn — nhịp của
            #    việc quét CVE không phải nhịp của PR (xem đầu tệp đó). Gộp nó vào đây là biến
            #    một quyết định đã cân nhắc thành một tác dụng phụ.
            #
            #    Thay vào đó trỏ vào `Cổng kiểm CI`: nó `needs` cả 9 job còn lại của `ci.yml`, và
            #    `CiGateCoverageTest` ĐÃ canh sẵn bất biến "cổng phủ MỌI job". Một cái tên thay
            #    cho bảy cái, và cái tên ấy tự lớn lên khi `ci.yml` thêm job — liệt kê bảy tên là
            #    tự hẹn một ngày quên cái thứ tám (luật 14).
            #
            #    Giữ `Backend*`/`Frontend*` để log vẫn nói ra hai cột nặng nhất đã chạy thế nào.
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq \
              '.check_runs[] | select(.name | startswith("Backend") or startswith("Frontend") or . == "Cổng kiểm CI")
               | "\(.name)=\(.conclusion)"')

            set +e
            printf '%s\n' "$runs" | bash .github/scripts/phan-loai-check-chang-truoc.sh "$SHA"
            ma=$?
            set -e

            case "$ma" in
              0) exit 0 ;;
              1) exit 1 ;;
            esac

            if [ "$lan" -lt 20 ]; then
              echo "   (lần $lan/20) còn phép kiểm chưa xong — chờ 30s rồi hỏi lại."
              sleep 30
            fi
          done

          # ⛔ Hết vòng chờ mà vẫn chưa biết kết quả ⇒ ĐỎ. Hai khả năng, nói ra CẢ HAI:
          #   — CI của chặng trước còn đang chạy (chờ thêm rồi chạy lại job này), hoặc
          #   — commit ấy CHƯA TỪNG chạy qua pipeline ở `dev` (đi tìm vì sao, đừng chạy lại).
          #   Từ T63.16 tập rỗng cũng rơi vào vòng chờ này, nên câu cũ — vốn chỉ nói vế
          #   thứ nhất — sẽ dẫn người đọc đi sai đường ở đúng ca nguy hiểm hơn.
          echo "::error::Sau 10 phút vẫn chưa biết kết quả CI của $SHA."
          echo "Hoặc CI của \`dev\` còn đang chạy — chờ nó xong rồi chạy lại job này;"
          echo "hoặc commit ấy CHƯA TỪNG chạy qua pipeline — khi đó chạy lại cũng vô ích,"
          echo "phải đi tìm vì sao \`ci.yml\` không kích hoạt trên \`dev\`."
          exit 1

      # ⚠ Bước checkout ở trên PHẢI có `fetch-depth: 0`. Bản clone nông làm
      #   `git rev-list A..B` trả về rỗng, và rỗng thì trông y hệt "sạch" — đúng
      #   hình dạng luật 7 (phép kiểm chạy qua tập rỗng vẫn xanh trọn vẹn).
      #   Script tự in con số đếm được trước khi kết luận, nên một lượt clone
      #   nông sẽ lộ ra ngay ở dòng "hơn … 0 commit".
      - name: Nhánh đích không được có commit riêng
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --quiet origin "$BASE" "$HEAD_REF"
          bash .github/scripts/kiem-goc-chung.sh "origin/$HEAD_REF" "origin/$BASE"
