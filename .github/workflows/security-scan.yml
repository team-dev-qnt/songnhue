# =============================================================================
# Quét lỗ hổng phụ thuộc — CHẠY THEO LỊCH, không chạy theo PR (WS-10 / T10.6)
#
# Vì sao tách khỏi `ci.yml` (chốt 18/8, sau lượt CI đầu tiên của repo):
#
#   Lượt đó job quét CVE chạy **30 phút rồi bị timeout huỷ**. Không có
#   `NVD_API_KEY` thì NVD giới hạn tốc độ rất nặng và lần đầu phải tải về
#   378.798 bản ghi. `continue-on-error: true` không cứu được vì nó chỉ áp cho
#   job *thất bại*; job bị **huỷ vì timeout** thoát khỏi nó và nhuộm
#   "cancelled" lên cả lượt chạy.
#
#   Nhưng nguyên nhân sâu hơn timeout: **nhịp của việc này không phải nhịp của
#   PR**. Kho phụ thuộc hôm nay không an toàn hơn vì có người mở PR, và nó kém
#   an toàn đi kể cả khi không ai đụng vào mã — vì thế giới công bố thêm CVE.
#   Gắn nó vào PR vừa làm chậm PR, vừa BỎ SÓT đúng trường hợp đáng lo nhất:
#   nhánh không ai đụng tới trong hai tuần.
#
# Ở PR giữ `dependency-review` (soi phần PR thêm vào, vài giây) — `ci.yml`.
# =============================================================================
name: Quét bảo mật phụ thuộc

on:
  schedule:
    # 02:15 UTC = 09:15 giờ Việt Nam — có kết quả trước giờ làm việc.
    - cron: '15 2 * * *'
  workflow_dispatch:
  # Đổi khai báo phụ thuộc thì quét lại ngay, không đợi tới đêm.
  #
  # ⚠ Danh sách này phải bao cả những tệp mà LƯỢT QUÉT ĐỌC, không chỉ tệp khai
  #   phụ thuộc (CLAUDE.md luật 24). `dependency-check-suppressions.xml` là tệp
  #   ảnh hưởng TRỰC TIẾP nhất tới việc lượt quét báo gì — thêm một mục vào đó có
  #   thể làm một CVE 9.8 biến mất khỏi báo cáo. Thiếu nó ở đây thì một thay đổi
  #   như vậy chỉ được kiểm ở lượt chạy theo lịch hôm sau (§10.69).
  push:
    branches: [dev]
    paths:
      - '**/pom.xml'
      - 'frontend/package-lock.json'
      - 'backend/dependency-check-suppressions.xml'

permissions:
  contents: read

jobs:
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    # Lần đầu dựng CSDL NVD là lâu thật, kể cả khi có khoá. Các lượt sau đọc
    # bộ nhớ đệm bên dưới nên chỉ còn vài phút.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # ⚠ `cache: maven` của setup-java CHỈ đệm `~/.m2/repository`. Bản phân phối
      #   Maven mà `mvnw` tải về nằm ở `~/.m2/wrapper/dists` và KHÔNG nằm trong
      #   đó — nên mỗi lượt CI đều tải lại ~9 MB từ repo.maven.apache.org bằng
      #   `wget`, KHÔNG có thử lại. Một lượt chập mạng là CI đỏ ở DÒNG ĐẦU TIÊN,
      #   trước khi có gì được biên dịch, với thông báo trỏ vào `spotless:check`
      #   — một bước hoàn toàn vô can (§10.47).
      - name: Đệm bản phân phối Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ runner.os }}-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      # Tách lượt tải ra khỏi lệnh build, và cho nó thử lại. Hai cái lợi riêng
      # biệt: (1) chập mạng không còn bị báo nhầm thành lỗi của bước sau;
      # (2) một lượt hỏng nhất thời tự khỏi thay vì bắt người ta bấm chạy lại.
      - name: Nạp sẵn Maven
        working-directory: backend
        run: |
          set -euo pipefail
          for lan in 1 2 3; do
            if ./mvnw -B -ntp -v; then
              exit 0
            fi
            echo "::warning::Lượt $lan tải bản phân phối Maven hỏng — thử lại sau ${lan}0 giây"
            sleep "${lan}0"
          done
          echo "::error::Không tải được bản phân phối Maven sau 3 lượt."
          echo "Kiểm tra repo.maven.apache.org còn phục vụ URL trong"
          echo "backend/.mvn/wrapper/maven-wrapper.properties hay không."
          exit 1

      # ⚠ Bộ nhớ đệm này là thứ quyết định job chạy 5 phút hay 45 phút.
      #   `restore-keys` cho phép lấy bản lượt trước rồi cập nhật phần thiếu,
      #   thay vì tải lại 378.798 bản ghi từ đầu.
      #
      # ⚠⚠ PHẢI TÁCH `restore` và `save`, KHÔNG dùng `actions/cache` gộp.
      #   `actions/cache` đặt `post-if: success()`, nên bước lưu **chỉ chạy khi
      #   job xanh**. Mà job này được thiết kế để ĐỎ mỗi khi có CVE ≥ 7 — tức
      #   là đúng trạng thái thường trực của nó. Kết quả ở lượt đầu (18/8):
      #   CSDL NVD dựng mất **26 phút** rồi **không được lưu**, `gh api
      #   .../actions/caches` không có mục `dc-data-*` nào. Mọi lượt sau lại
      #   trả 26 phút đó — bộ nhớ đệm viết ra để tránh đúng chuyện ấy.
      #
      #   Đây là một vòng tự triệt tiêu: cơ chế tăng tốc chỉ hoạt động trong
      #   trường hợp duy nhất mà nó không cần thiết.
      - name: Nạp bộ nhớ đệm CSDL NVD
        id: nvd_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.dc-data
          key: dc-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dc-data-${{ runner.os }}-

      - name: Kiểm khoá NVD
        id: nvd
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "co_khoa=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠ Chưa có \`NVD_API_KEY\` — BỎ QUA quét OWASP"
              echo ""
              echo "Thiếu khoá thì NVD giới hạn tốc độ tới mức lượt quét đầu tiên"
              echo "mất hàng chục phút rồi bị timeout huỷ — đúng chuyện đã xảy ra"
              echo "ở lượt CI đầu tiên ngày 18/8."
              echo ""
              echo "**Cách gỡ** (miễn phí, ~2 phút):"
              echo "1. Xin khoá: <https://nvd.nist.gov/developers/request-an-api-key>"
              echo "2. Settings → Secrets and variables → Actions → New repository secret"
              echo "3. Tên: \`NVD_API_KEY\`"
              echo ""
              echo "⛔ Đây là **bỏ qua một phép kiểm bảo mật**, không phải 'không sao'."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "co_khoa=true" >> "$GITHUB_OUTPUT"
          fi

      # Tách CẬP NHẬT CSDL khỏi PHÉP QUÉT, và lưu bộ nhớ đệm ở giữa hai bước.
      # Cập nhật là việc tốn thời gian nhưng gần như luôn thành công; quét là
      # việc nhanh nhưng đỏ thường xuyên. Gộp chung thì kết quả của cái sau
      # quyết định cái trước có được giữ lại hay không — vô lý.
      # `-N` để chỉ chạy một lượt ở pom cha, không lặp cho từng module.
      - name: Cập nhật CSDL NVD
        if: steps.nvd.outputs.co_khoa == 'true'
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B -ntp -P security -N org.owasp:dependency-check-maven:update-only \
            -Ddependency-check.data="${{ github.workspace }}/.dc-data"

      # `if: always()` là điểm mấu chốt — xem ghi chú ở bước nạp phía trên.
      # Đặt TRƯỚC bước quét để bản CSDL vừa dựng chắc chắn được giữ, kể cả khi
      # phép quét đỏ (trạng thái thường trực của job này).
      - name: Lưu bộ nhớ đệm CSDL NVD
        if: always() && steps.nvd.outputs.co_khoa == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.dc-data
          key: dc-data-${{ runner.os }}-${{ github.run_id }}

      # `aggregate` cần jar của các module anh em để giải phụ thuộc liên module,
      # nên phải dựng trước. Bỏ test vì test đã chạy ở `ci.yml`.
      - name: Dựng jar mọi module
        if: steps.nvd.outputs.co_khoa == 'true'
        working-directory: backend
        run: ./mvnw -B -ntp -P security package -DskipTests

      # ⚠⚠ `aggregate`, KHÔNG phải `check` (đổi 18/8).
      #
      #   `check` chạy riêng từng module và Maven dừng reactor ở module đầu tiên
      #   hỏng — năm module còn lại in `SKIPPED`, tức **chưa từng được quét**.
      #   Bốn lượt quét liên tiếp chỉ soi đúng module `core`; `app` mãi tới lượt
      #   thứ năm mới lộ ra CVE-2026-54291. Người sửa tưởng đang đập chuột chũi,
      #   thực chất chưa bao giờ nhìn thấy toàn cảnh.
      #
      #   `aggregate` soi gốc + mọi module con trong MỘT lượt rồi áp ngưỡng một
      #   lần → một danh sách đầy đủ, một báo cáo, và số lần lặp = số lần thật sự
      #   cần sửa.
      #
      # `-DautoUpdate=false`: CSDL đã dựng ở bước trên, không chạm mạng NVD lần nữa.
      - name: OWASP Dependency-Check — toàn bộ module (fail ở CVSS ≥ 7)
        if: steps.nvd.outputs.co_khoa == 'true'
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B -ntp -P security dependency-check:aggregate \
            -Ddependency-check.data="${{ github.workspace }}/.dc-data" \
            -DautoUpdate=false

      - name: Giữ lại báo cáo CVE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          # `aggregate` ghi MỘT báo cáo ở `backend/target/`, khác `check` (mỗi
          # module một báo cáo ở `backend/<module>/target/`). Khai cả hai đường
          # dẫn tường minh thay vì trông vào việc `**` có khớp zero thư mục hay
          # không — báo cáo CVE là thứ duy nhất đọc được sau khi job đỏ.
          path: |
            backend/target/dependency-check-report.*
            backend/*/target/dependency-check-report.*
          retention-days: 14
          # ⚠ `ignore` là sai chỗ này: glob trượt thì artifact lặng lẽ không có,
          # và người ta chỉ phát hiện lúc cần đọc báo cáo nhất. `warn` để nó nói.
          if-no-files-found: warn

  npm:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Đọc `.nvmrc` thay vì ghi cứng — trước đây Node khai ở 5 nơi rời nhau
          # (2 workflow, 3 Dockerfile, `engines.node`) và không nơi nào là nguồn.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ⚠ Một lockfile duy nhất ở `frontend/` — npm workspaces. Chạy trong
      #   từng app là lỗi đã mắc một lần rồi (nợ #36).
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
