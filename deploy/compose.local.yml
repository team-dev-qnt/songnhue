# =============================================================================
# STACK LOCAL — chọn TỪNG service chạy trong Docker bằng profile
#
# Hạ tầng (postgres, minio, mailpit) KHÔNG có profile → luôn chạy.
# Ba service ứng dụng nằm sau profile, bật cái nào thì chạy cái đó:
#
#   (không profile)              → chỉ hạ tầng        · make dev-infra
#   --profile backend            → + backend          · make dev-be   (bạn code FE)
#   --profile admin --profile public → + 2 app FE     · make dev-fe   (bạn code BE)
#   --profile full               → tất cả             · make dev-docker
#
# ⭐ MỌI image đều BUILD TỪ MÃ NGUỒN LOCAL (`build:` trỏ vào backend/ và
#    frontend/). Không kéo image dựng sẵn từ registry ở chế độ local.
#    • `up -d`         → dùng image đã build, KHÔNG build lại
#    • `up -d --build` → build lại từ code hiện tại  (= `make dev-* BUILD=1`)
#    Sửa code xong PHẢI build lại — image không tự bám theo file trên máy.
#    Đổi lại: build lại chỉ ~7 giây nhờ cache lớp dependency.
#
# ⚠ Service nào ĐANG SỬA thì chạy native, đừng chạy trong Docker — Docker ở đây
#   là để dựng NHỮNG THỨ CÒN LẠI. Xem docs/run-guideline.md.
# =============================================================================
name: songnhue

include:
  - compose.infra.yml

services:
  # ---------------------------------------------------------------------------
  # migrator — chạy Flyway rồi thoát, ĐÚNG mô hình Staging/Production
  # (architecture-review.md §9.2). Nhờ vậy đường deploy được diễn tập ngay ở local.
  # ---------------------------------------------------------------------------
  migrator:
    profiles: ["backend", "full"]
    image: songnhue-app:local
    build:
      context: ../backend
      dockerfile: ../deploy/docker/backend.Dockerfile
    container_name: songnhue-migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      # ⚠⚠ PHẢI có, và phải là `service_completed_successfully` — giống hệt
      #   `compose.prod.yml`. Migration seed ghi hàng `attachments` KHẲNG ĐỊNH byte
      #   đã có trong MinIO; đảo thứ tự thì CSDL nói tệp tồn tại còn
      #   `GET /api/v1/public/files/<id>` trả 404 — hỏng CÂM. Ràng buộc đặt ở chỗ
      #   lời khẳng định được viết ra, không đặt ở thứ tự dòng lệnh.
      minio-init:
        condition: service_completed_successfully
    env_file:
      - ./env/local.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # Migrator chỉ chạy DDL, nhưng context Spring vẫn dựng vài bean có `@Scheduled`
      # (Spring Boot cố ý loại chúng khỏi khởi tạo lười, nếu không tác vụ định kỳ
      # không bao giờ chạy) — và chúng kéo theo `BackupProperties`. Cấp một đường dẫn
      # hợp lệ là đủ; đây không phải bí mật.
      BACKUP_DIR: /var/lib/songnhue/backup
    command: ["--spring.profiles.active=migrate"]
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # app — backend. Migration KHÔNG chạy ở đây (FLYWAY_ENABLED=false), giống
  # production: migration hỏng thì app không lên nửa vời.
  # ---------------------------------------------------------------------------
  app:
    profiles: ["backend", "full"]
    image: songnhue-app:local
    build:
      context: ../backend
      dockerfile: ../deploy/docker/backend.Dockerfile
    container_name: songnhue-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file:
      - ./env/local.env
    environment:
      # Ghi đè các giá trị trỏ ra host: trong mạng Docker phải gọi theo tên service
      DB_HOST: postgres
      DB_PORT: 5432
      MINIO_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Cổng bên trong container luôn 8080; đổi cổng thì đổi ở phần ports bên dưới
      APP_PORT: 8080
      FLYWAY_ENABLED: "false"
      SPRING_PROFILES_ACTIVE: local
      # Khóa nằm ngoài image — mount vào lúc chạy, không bao giờ bake vào layer
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
      # Đường dẫn TRONG container. Giá trị ở local.env là đường dẫn tương đối của máy
      # dev (`./.backup`), trong container nó thành `/app/./.backup` — sai chỗ, và
      # Dockerfile đã chuẩn bị sẵn /var/lib/songnhue/backup đúng chủ sở hữu cho việc này.
      BACKUP_DIR: /var/lib/songnhue/backup
      # Cổng công khai (WS-16/T16.5). Gọi theo TÊN SERVICE trong mạng Docker — dùng
      # localhost thì backend gọi vào chính nó. Bí mật phải khớp biến cùng tên của
      # public-web; lệch nhau thì Next trả 401 và job dựng lại trang thử lại 5 lần rồi hỏng.
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://public-web:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-doi-bi-mat-nay-o-moi-truong-that}
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "127.0.0.1:${DOCKER_APP_PORT:-18080}:8080"

  # ---------------------------------------------------------------------------
  # admin-app (Vite + React + AntD) — bundle tĩnh, phục vụ bằng nginx
  # ⬜ CHƯA DÙNG ĐƯỢC: thư mục frontend/admin-app do WS-8 tạo.
  # ---------------------------------------------------------------------------
  admin-app:
    profiles: ["admin", "full"]
    image: songnhue-admin-app:local
    build:
      context: ../frontend
      dockerfile: ../deploy/docker/admin-app.Dockerfile
      args:
        # ⚠⚠ Để TRỐNG là có chủ ý — `apiClient` khi đó dùng đường dẫn TƯƠNG ĐỐI
        # `/api/v1`, và nginx của chính image này chuyển tiếp sang backend.
        #
        # Bản đầu đặt `http://localhost:18080/api/v1`: trình duyệt ở cổng 15173
        # gọi sang cổng 18080 là khác origin → preflight bị trả `403 Invalid CORS
        # request` → **không một lượt gọi nào chạy được**, bắt đầu từ ô đăng nhập.
        # Lỗi không lộ ra ở lượt kiểm bằng `curl` vì curl không làm preflight.
        #
        # ⚠⚠ Dòng `:-` này KHÔNG phải nơi quyết định. Makefile gọi compose với
        # `--env-file env/local.env`, mà `--env-file` nuôi luôn phép thế biến, nên
        # giá trị ở tệp env THẮNG mặc định ở đây. Lần sửa trước chỉ đổi chỗ này và
        # để nguyên dòng `VITE_API_BASE_URL=http://localhost:18080/api/v1` bên kia
        # → lỗi vẫn sống nguyên. `FrontendSameOriginTest` nay soi cả hai nơi.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: songnhue-admin-app
    restart: unless-stopped
    environment:
      # Đích chuyển tiếp của nginx — đọc LÚC CHẠY qua cơ chế template của image
      # nginx, nên `make dev-fe` (backend chạy native trên máy chủ) chỉ cần đổi
      # biến này, không phải dựng lại image.
      API_UPSTREAM: ${API_UPSTREAM:-http://app:8080}
    # Cần cho `make dev-fe`: trỏ ra backend native trên máy chủ. Docker Desktop
    # có sẵn tên này, Linux thì không — khai tường minh để hai nền giống nhau.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${DOCKER_ADMIN_APP_PORT:-15173}:80"

  # ---------------------------------------------------------------------------
  # public-web (Next.js) — chế độ standalone
  # ---------------------------------------------------------------------------
  public-web:
    profiles: ["public", "full"]
    image: songnhue-public-web:local
    build:
      context: ../frontend
      dockerfile: ../deploy/docker/public-web.Dockerfile
      args:
        # ⚠⚠ Để TRỐNG là có chủ ý — trình duyệt khi đó gọi đường dẫn TƯƠNG ĐỐI `/api/v1`, và
        # Next chuyển tiếp sang backend bằng Route Handler `src/app/api/v1/[...path]/route.ts`
        # (KHÔNG phải `rewrites()` — với `output: standalone` thì nó bị nướng vào lúc build).
        # Bản đầu đặt `http://localhost:18080` là khác origin, mà backend không cấu hình CORS
        # → preflight `403 Invalid CORS request` → bộ đếm lượt xem chưa từng chạy được từ
        # trình duyệt thật. Giá trị thật đến từ `env/local.env`, xem ghi chú ở service trên.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:13000}
    container_name: songnhue-public-web
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      # ⚠ Phải KHỚP biến cùng tên của service `app`. Đây là toàn bộ cơ chế xác thực của
      # `POST /api/revalidate`; để trống thì endpoint tự đóng (503) — mặc định an toàn.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-doi-bi-mat-nay-o-moi-truong-that}
      # ⚠⚠ KHÁC với NEXT_PUBLIC_API_BASE_URL, và sự khác biệt đó là bắt buộc. Biến kia là
      # đường dẫn TƯƠNG ĐỐI mà trình duyệt gọi. Biến này là địa chỉ TIẾN TRÌNH NEXT gọi —
      # cả khi dựng trang lẫn khi chuyển tiếp — nên phải TUYỆT ĐỐI và gọi theo tên service
      # trong mạng Docker. Dùng nhầm thì Next gọi vào chính nó và cổng dựng ra một trang
      # trắng hoàn toàn hợp lệ. `make dev-fe` ghi đè sang `host.docker.internal`.
      API_INTERNAL_BASE_URL: ${API_INTERNAL_BASE_URL:-http://app:8080/api/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOCKER_PUBLIC_WEB_PORT:-13000}:3000"
