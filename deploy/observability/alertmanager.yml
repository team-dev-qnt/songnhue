# =============================================================================
# Alertmanager — VPS-2 (T61.5). Chốt 14/09/2026 với QuanTran:
#   · production critical → Gmail + Slack + Telegram
#   · production warning  → Slack + Telegram
#   · staging (mọi mức)   → chỉ Slack
#   · email dùng CHUNG SMTP của ứng dụng (SMTP_* trong .env)
#
# ⛔ Đây là MẪU. `__TÊN__` do `dien-cau-hinh.sh` điền lúc khởi động; bí mật nằm ở
#    /tmp/am/* (tệp 0600), cấu hình trỏ bằng `*_file` — ⛔ bao giờ nằm trong tệp này.
#
# ⚠ Tuyến MẶC ĐỊNH là tuyến ỒN NHẤT (prod-critical). Một cảnh báo thiếu nhãn
#   `environment` — luật mới quên gắn, hay một `absent()` quên bộ chọn — phải kêu
#   to, ⛔ được rơi vào im lặng (cùng tinh thần luật 24: trục trặc thì chạy thừa).
# =============================================================================
global:
  resolve_timeout: 5m
  smtp_smarthost: '__SMTP_HOST__:__SMTP_PORT__'
  smtp_from: '__SMTP_FROM__'
  smtp_auth_username: '__SMTP_USERNAME__'
  smtp_auth_password_file: /tmp/am/smtp_password
  smtp_require_tls: true

route:
  receiver: prod-critical
  group_by: [alertname, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['environment="staging"']
      receiver: staging-slack
    - matchers: ['environment="production"', 'severity="warning"']
      receiver: prod-warning

# Ứng dụng ⛔ trả chỉ số thì mọi luật đọc chỉ số của nó cùng kêu — một sự cố thành
# năm tin nhắn. Giữ tin gốc, nén các tin ăn theo CÙNG môi trường.
inhibit_rules:
  - source_matchers: ['alertname="UngDungKhongPhanHoi"']
    target_matchers: ['alertname!="UngDungKhongPhanHoi"']
    equal: [environment]

templates:
  - /etc/alertmanager/songnhue.tmpl

receivers:
  - name: prod-critical
    email_configs:
      - to: '__ALERT_EMAIL_TO__'
        send_resolved: true
        headers:
          Subject: '{{ template "songnhue.tieude" . }}'
    slack_configs:
      - api_url_file: /tmp/am/slack_webhook
        send_resolved: true
        title: '{{ template "songnhue.tieude" . }}'
        text: '{{ template "songnhue.noidung" . }}'
    telegram_configs:
      - bot_token_file: /tmp/am/telegram_token
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        parse_mode: ''
        message: '{{ template "songnhue.tieude" . }}{{ "\n" }}{{ template "songnhue.noidung" . }}'

  - name: prod-warning
    slack_configs:
      - api_url_file: /tmp/am/slack_webhook
        send_resolved: true
        title: '{{ template "songnhue.tieude" . }}'
        text: '{{ template "songnhue.noidung" . }}'
    telegram_configs:
      - bot_token_file: /tmp/am/telegram_token
        chat_id: __TELEGRAM_CHAT_ID__
        send_resolved: true
        parse_mode: ''
        message: '{{ template "songnhue.tieude" . }}{{ "\n" }}{{ template "songnhue.noidung" . }}'

  - name: staging-slack
    slack_configs:
      - api_url_file: /tmp/am/slack_webhook
        send_resolved: true
        title: '{{ template "songnhue.tieude" . }}'
        text: '{{ template "songnhue.noidung" . }}'
