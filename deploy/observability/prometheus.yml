# =============================================================================
# Prometheus — chạy trên VM-3 (WS-7 / T7.9)
#
# ⭐ VÌ SAO ĐẶT Ở VM-3 CHỨ KHÔNG PHẢI CÙNG MÁY VỚI ỨNG DỤNG
#   Hệ giám sát nằm chung máy với thứ nó giám sát thì chết cùng lúc với nó. Ổ
#   đĩa VM-1 hỏng lúc 2 giờ sáng: ứng dụng chết, Prometheus chết, cảnh báo chết
#   — và sáng ra không ai biết chuyện gì đã xảy ra, kể cả lúc nào. Đặt ở VM-3
#   thì chuỗi giám sát SỐNG SÓT qua đúng sự cố mà nó phải báo.
#   Đây cũng là máy giữ bản sao lưu (T7.2) — hai việc cùng một lý do.
#
# Lưu giữ 90 ngày: đủ để đối chiếu "tháng này chậm hơn tháng trước" khi nghiệm
# thu NFR (99% · 200 CCU · 3s), không cần hơn.
# =============================================================================
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: songnhue

rule_files:
  - /etc/prometheus/alerts.yml

# ⛔ Đây là MẪU: `__TÊN__` do `dien-cau-hinh.sh` điền lúc container khởi động.
#    Prometheus ⛔ thay biến môi trường trong tệp này — bản trước viết
#    `${PROD_APP_TARGET}` và Prometheus dùng NGUYÊN VĂN chuỗi ấy (T61.5).
#    `CanhBaoCoDuongDiTest` đỏ nếu `${` quay lại.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ---------------------------------------------------------------------------
  # Ứng dụng — nguồn của mọi chỉ số nghiệp vụ (sao lưu, poller, hàng đợi, bảo mật)
  #
  # ⚠ Nhãn `environment` là thứ Alertmanager dùng để định tuyến. Thiếu nó thì
  #   cảnh báo rơi vào tuyến MẶC ĐỊNH (ồn nhất) — cố ý, xem alertmanager.yml.
  # ---------------------------------------------------------------------------

  # Production (VPS-1): ⛔ cổng nào của app mở ra ngoài. Đi qua nginx biên trên
  # HTTPS, `location = /actuator/prometheus` chỉ nhận IP của VPS-2 + token (T61.5).
  - job_name: songnhue-app-production
    metrics_path: /actuator/prometheus
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /tmp/prom/metrics_token
    static_configs:
      - targets: ['__PROD_METRICS_HOST__:443']
        labels:
          environment: production

  # Staging (cùng máy VPS-2): Prometheus nối vào mạng `songnhue_default` của stack
  # staging (compose.observability.yml) nên gọi thẳng tên container.
  - job_name: songnhue-app-staging
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      - targets: ['songnhue-app:8080']
        labels:
          environment: staging

  # node_exporter trên VM-3 — đọc cả tệp textfile do pull-from-prod.sh ghi ra,
  # tức là chỉ số "bản sao lưu đã ra khỏi máy chủ CSDL chưa" (T7.2).
  - job_name: songnhue-vm3
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
