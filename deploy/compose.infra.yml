# =============================================================================
# HẠ TẦNG LOCAL — PostgreSQL + PostGIS · MinIO · Mailpit
#
# Dùng một mình khi bạn chạy CẢ backend LẪN frontend native:
#   make dev-infra
#
# File này được `compose.local.yml` include lại, nên mọi thứ khai báo ở đây
# đều có mặt trong mọi chế độ chạy.
#
# ⭐ CỔNG: mọi thứ Docker publish ra host đều nằm ở DẢI RIÊNG, không đụng cổng
#    mặc định của tiến trình chạy native. Quy tắc: THÊM SỐ "1" VÀO ĐẦU.
#        5432 → 15432   ·   9000 → 19000   ·   9001 → 19001
#        1025 → 11025   ·   8025 → 18025
#    Nhờ vậy máy có sẵn PostgreSQL/MinIO chạy native vẫn dùng được dự án này,
#    và không bao giờ có chuyện app nối nhầm sang DB của máy.
# =============================================================================
name: songnhue

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: songnhue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Script init đọc 4 mật khẩu này để CREATE ROLE (deploy/postgres/init)
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ARCHIVER_PASSWORD: ${DB_ARCHIVER_PASSWORD}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD}
      # ⚠ COLLATION — chốt 14/8/2026, KHÔNG đổi sau khi đã có dữ liệu.
      # ICU vi-VN cho ORDER BY tiếng Việt đúng (Anh < Dung < Đăng < Em) — Đ đứng
      # sau D trong bảng chữ cái tiếng Việt. Bỏ dòng này thì sai theo kiểu nào là
      # tuỳ locale mặc định; đo 26/8 trên chính image postgis/postgis:16-3.4:
      #     mặc định của image (glibc en_US.utf8) → Anh < Đăng < Dung < Em
      #     locale C (so theo byte)               → Anh < Dung < Em < Đăng
      # Cả hai đều sai rõ trong danh bạ nhân sự và danh mục công trình. Đổi về sau
      # = dump + xoá volume + restore, nên Staging/Production BẮT BUỘC dùng đúng
      # dòng này — và cluster ĐANG CHẠY được đo lại ở mỗi lượt triển khai bằng
      # `deploy/postgres/kiem-collation.sh`, vì tệp cấu hình không chứng minh được
      # cluster đã dựng ra sao.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=vi-VN --locale=C.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Chỉ chạy khi volume còn rỗng: tạo 4 role + 3 extension (WS-2/T2.1, T2.7)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DOCKER_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: songnhue-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${DOCKER_MINIO_PORT:-19000}:9000"        # S3 API
      - "127.0.0.1:${DOCKER_MINIO_CONSOLE_PORT:-19001}:9001" # Giao diện web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Tạo bucket rồi thoát. Chạy lại nhiều lần không sao (--ignore-existing).
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: songnhue-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA}
      MINIO_BUCKET_REPORT: ${MINIO_BUCKET_REPORT}
      MINIO_BUCKET_AUDIT: ${MINIO_BUCKET_AUDIT}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        for b in "$$MINIO_BUCKET_MEDIA" "$$MINIO_BUCKET_REPORT" "$$MINIO_BUCKET_AUDIT"; do
            mc mb --ignore-existing "local/$$b"
        done
        # Bucket kết xuất nhật ký bật versioning: bản lưu trữ audit là bằng chứng
        # đối soát, ghi đè nhầm phải khôi phục được (conventions.md §4.3, G7).
        mc version enable "local/$$MINIO_BUCKET_AUDIT"
        echo "✓ Bucket sẵn sàng"

  # Bắt toàn bộ email hệ thống gửi đi — không thư nào thoát ra ngoài khi dev.
  # Dùng Mailpit thay MailHog: MailHog không còn được bảo trì và không có image
  # arm64 (máy Apple Silicon phải giả lập).
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: songnhue-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${DOCKER_SMTP_PORT:-11025}:1025"         # SMTP
      - "127.0.0.1:${DOCKER_MAILPIT_UI_PORT:-18025}:8025"   # Hộp thư web
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  minio-data:
