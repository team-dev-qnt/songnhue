# =============================================================================
# Tham số chuyển tiếp dùng chung cho mọi khối `location` của nginx biên
# =============================================================================
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# ⚠ Backend đọc IP thật từ chuỗi này để ghi security event (WS-7/T7.10) và để
#   tính hạn mức theo IP (RateLimitFilter). Thiếu nó thì MỌI lượt đăng nhập
#   trông như đến từ chính nginx, và một người gõ sai mật khẩu 5 lần sẽ khoá
#   hạn mức đăng nhập của cả cơ quan.
#
#   Chuỗi đi qua hai chặng: biên → image FE → app. Mỗi chặng `$proxy_add_...`
#   NỐI THÊM ip của chặng trước, nên app nhận `<ip thật>, <ip biên>` và lấy
#   phần tử đầu. Đổi một chặng sang `$remote_addr` trần là cắt mất ip thật.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / SSE — chưa dùng ở v1 nhưng để sẵn thì không tốn gì, còn thiếu thì
# triệu chứng là kết nối rớt sau 60 giây mà không có dòng log nào.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# Không đệm phản hồi: tải tệp đính kèm lớn không phải nằm chờ nginx ghi xong ra
# đĩa tạm mới bắt đầu chảy về trình duyệt.
proxy_buffering off;
