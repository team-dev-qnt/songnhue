# =============================================================================
# Tham số chuyển tiếp dùng chung cho mọi khối `location` của nginx biên
# =============================================================================
proxy_http_version 1.1;
proxy_set_header Host              $host;
# ⭐⭐ ĐÂY là nguồn sự thật về ip máy khách cho backend — T43.8-b, 10/09/2026.
#
#   `$remote_addr` ở CHẶNG BIÊN là ip của chính người gọi, và `proxy_set_header`
#   GHI ĐÈ mọi giá trị client tự gửi. Hai tính chất ấy cộng lại là điều kiện làm
#   `ClientIp` (backend/core/.../common/web/ClientIp.java) tin được header này.
#   ⛔ Đổi dòng này sang `$http_x_real_ip` ở CHẶNG BIÊN là mở lại đúng lỗ hổng
#     T43.8-b: chặng biên phải GHI ĐÈ, các chặng TRONG mới chuyển tiếp.
proxy_set_header X-Real-IP         $remote_addr;

# ⚠⚠ `X-Forwarded-For` NỐI THÊM — và vì thế nó ⛔ KHÔNG định danh được ai.
#
#   Chú thích cũ ở đây viết: *"app nhận `<ip thật>, <ip biên>` và lấy phần tử
#   đầu"*. Câu ấy chỉ đúng khi client KHÔNG tự gửi header. Client gửi
#   `X-Forwarded-For: 1.2.3.4` thì app nhận `1.2.3.4, <ip thật>, <ip biên>` và
#   phần tử đầu là giá trị KẺ GỌI TỰ ĐẶT ⇒ trước 10/09/2026, cả bốn hạn mức
#   (đăng nhập · API · công khai · xuất) né được bằng một header, và một IP bịa
#   ghi thẳng vào nhật ký bảo mật.
#
#   ⇒ Giữ header này để đọc log thấy đủ chuỗi chặng, nhưng ⛔ KHÔNG nơi nào
#     trong backend được dùng nó để định danh máy khách. Xem `ClientIp`.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / SSE — chưa dùng ở v1 nhưng để sẵn thì không tốn gì, còn thiếu thì
# triệu chứng là kết nối rớt sau 60 giây mà không có dòng log nào.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# Không đệm phản hồi: tải tệp đính kèm lớn không phải nằm chờ nginx ghi xong ra
# đĩa tạm mới bắt đầu chảy về trình duyệt.
proxy_buffering off;
