# =============================================================================
# Header do NGINX BIÊN đặt — và CHỈ những header thuộc về nơi kết thúc TLS
# =============================================================================
#
# ⚠⚠ Cố ý KHÔNG đặt lại CSP / X-Frame-Options / X-Content-Type-Options /
#    Referrer-Policy / Permissions-Policy ở đây. Hai image FE đã đặt đủ chúng
#    (deploy/docker/admin-app.Dockerfile · public-web `next.config`), và
#    `NginxSecurityHeadersTest` canh đúng những chỗ đó.
#
#    Đặt lần thứ hai ở tầng biên sinh ra **header trùng**. Với CSP, trình duyệt
#    áp giao của mọi bản — tức bản chặt hơn thắng — nên một CSP "chung chung"
#    ở biên sẽ âm thầm siết hoặc phá bản đã cân chỉnh kỹ cho AntD và cho tile
#    bản đồ, mà triệu chứng chỉ là vài dòng trong console không ai mở.
#
#    Nguyên tắc: mỗi header có ĐÚNG MỘT nơi chịu trách nhiệm.
#      • Thuộc về nội dung  → tầng phục vụ nội dung (image FE)
#      • Thuộc về kênh TLS  → tầng kết thúc TLS (tệp này)
#
# HSTS chỉ có nghĩa ở đây vì đây là nơi duy nhất thật sự có HTTPS. Đặt ở image
# FE thì local chạy HTTP nên trình duyệt bỏ qua — tạo cảm giác đã được bảo vệ
# mà thật ra chưa.
#
# ⚠ `preload` cố ý CHƯA bật. Vào danh sách preload của trình duyệt là **một
#   chiều trong nhiều tháng**: mọi tên miền con, kể cả cái chưa dựng, buộc phải
#   có HTTPS hợp lệ vĩnh viễn. Chỉ bật sau khi hệ đã chạy ổn định và chắc chắn
#   không còn dịch vụ nội bộ nào phải đi qua HTTP.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ⚠⚠ CHẶN CÔNG CỤ TÌM KIẾM ĐÁNH CHỈ MỤC STAGING — quan trọng hơn vẻ ngoài của nó.
#
#   `NEXT_PUBLIC_SITE_URL` bị Next nướng vào bundle LÚC BUILD, mà nguyên tắc
#   "đóng gói một lần rồi đề bạt" lại đòi staging và production chạy CÙNG một
#   image. Hệ quả không tránh được: `sitemap.xml`, `robots.txt` và thẻ canonical
#   trên staging đều mang địa chỉ production.
#
#   Nếu Google bò được vào staging, nó sẽ thấy một bản sao toàn bộ nội dung tự
#   khai canonical trỏ về production — đúng hình dạng nội dung trùng lặp, và
#   thứ hạng của cổng thật là thứ chịu thiệt. Header này chặn ngay ở tầng biên,
#   trước khi bất kỳ trang nào kịp được đọc.
#
#   Giá trị đến từ `map` khai trong `default.conf.template` (snippet KHÔNG được
#   envsubst xử lý, chỉ template mới được), lấy từ biến `ROBOTS_TAG` trong `.env`:
#       production → all                (không hạn chế)
#       staging    → noindex, nofollow
#
#   📌 Cách chữa tận gốc là cho `SITE_URL` đọc LÚC CHẠY thay vì lúc build —
#      `frontend/public-web/src/lib/site.ts` chỉ được các tệp phía máy chủ dùng
#      nên đổi được. Xem docs/deploy-guideline.md §9.3.
add_header X-Robots-Tag $robots_tag always;
