# =============================================================================
# CHẶN TÀI LIỆU API Ở TẦNG BIÊN — T11.6-a (nợ nhận từ WS-4)
# =============================================================================
#
# `springdoc` phục vụ `/v3/api-docs` (lược đồ OpenAPI đầy đủ) và `/swagger-ui.html`
# + `/swagger-ui/**` (giao diện gọi thử). Cả hai liệt kê MỌI endpoint, mọi tham
# số, mọi hình dạng DTO — kể cả những đường chỉ dành cho vai trò quản trị. Đó là
# bản đồ tấn công viết sẵn, và nó không có tác dụng gì với người dùng cuối.
#
# ⚠⚠ VÌ SAO TỆP NÀY TỒN TẠI DÙ ĐO ĐƯỢC LÀ "HIỆN KHÔNG VỚI TỚI ĐƯỢC"
#
#    Đo trên staging 3/9/2026, trước khi có tệp này:
#
#        https://staging.songnhue.com/v3/api-docs            → 404 (trang 404 của Next)
#        https://staging.songnhue.com/swagger-ui.html        → 404
#        https://admin-staging.songnhue.com/v3/api-docs      → 200, 2138 byte = index.html của SPA
#        https://admin-staging.songnhue.com/swagger-ui.html  → 200, 2138 byte = index.html của SPA
#
#    Tức là tài liệu API thật sự KHÔNG ra ngoài. Nhưng lý do nó không ra ngoài là
#    một TAI NẠN CỦA ĐỊNH TUYẾN, không phải một bảo đảm ai đó đặt ra: backend chỉ
#    với tới được qua tiền tố `/api/`, mà hai đường của springdoc nằm ngoài tiền
#    tố ấy, nên chúng rơi vào `location /` và được trả lời bằng nội dung tĩnh.
#
#    Đổi `springdoc.api-docs.path` sang `/api/docs`, thêm một `location`, hay đổi
#    một upstream — bất kỳ việc nào trong ba việc đó đều mở lại đường, và KHÔNG
#    lượt rà nào kêu, vì chưa từng có gì để kêu.
#
#    Và `application.yml` đã khẳng định suốt từ WS-4 rằng *"Trên production nginx
#    chặn 2 đường dẫn này (WS-11/T11.6)"* — trong khi toàn bộ cấu hình nginx của
#    kho **không có một dòng nào** về swagger. Một cam kết ghi trong chú thích mà
#    không cơ chế nào thi hành: đúng hình dạng dự án đã trả giá nhiều lần.
#
# ⚠ PHẢI là `location ~` (regex), không phải tiền tố.
#
#    nginx xét regex TRƯỚC mọi khối tiền tố (trừ `^~`). Hôm nay `/v3/api-docs`
#    không đụng `location /api/`, nên tiền tố cũng đủ; nhưng nếu đường dẫn của
#    springdoc chuyển vào dưới `/api/` thì một khối tiền tố sẽ THUA `location
#    /api/` và bản vá này im lặng ngừng có tác dụng. Regex thắng ở cả hai trường
#    hợp — chọn cái đúng trong cả hai, đừng chọn cái đúng trong trường hợp hôm nay.
#
# `404` chứ không `403`: 403 nói "có ở đây nhưng anh không được vào" — tức vẫn
# xác nhận đường dẫn tồn tại. 404 không nói gì cả.
# =============================================================================
location ~ ^/(swagger-ui|v3/api-docs) {
    access_log off;
    return 404;
}
